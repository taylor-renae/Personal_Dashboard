services:
  db:
    image: postgres:16
    container_name: dashboard-db
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    ports:
      - "5432:5432"
    volumes:
      - dashboard-data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration:/migrations

volumes:
  dashboard-data: