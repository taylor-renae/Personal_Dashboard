spring.application.name=dashboard

spring.datasource.url=jdbc:postgresql://localhost:5432/dashboard
spring.datasource.username=dashboard
spring.datasource.password=dashboard

# Flyway creates the tables, Hibernate only checks they match the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Loads API tokens from .env (used starting week 3)
spring.config.import=optional:file:../.env[.properties]
